# Same-origin serving: the app at /, the API proxied at /api, so the browser needs no CORS.
# Security headers live at server level only: an add_header inside a location would drop them.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 21m;   # the API refuses anything above 20 MB anyway (ADR-016)

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 30s;
    }

    location = /config.json {
        expires -1;
    }

    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri /index.html;
    }
}
