<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">SecondChance AWS reference architecture</title>
  <desc id="desc">The public application path begins at AWS WAF and CloudFront for the React application, and at API Gateway with a Cognito JWT authorizer for the API. Private Lambda workloads use Aurora, S3, SQS and Bedrock through VPC endpoints. Agent tools must pass through the MCP Gateway before the private tool executor can reach data and AI services.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#344054"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e85d04"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#101828" flood-opacity=".10"/></filter>
    <style>
      .bg{fill:#f7f9fc}.zone{fill:#fff;stroke:#d0d5dd;stroke-width:2}.zone-private{fill:#f8fbff;stroke:#84adff;stroke-width:2}.zone-data{fill:#fffaf5;stroke:#fdb022;stroke-width:2}.card{fill:#fff;stroke:#98a2b3;stroke-width:1.5;filter:url(#shadow)}.gateway{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5;filter:url(#shadow)}.mcp{fill:#fff4ed;stroke:#e85d04;stroke-width:3;filter:url(#shadow)}.data{fill:#fffaeb;stroke:#f79009;stroke-width:1.8;filter:url(#shadow)}.security{fill:#ecfdf3;stroke:#12b76a;stroke-width:1.8;filter:url(#shadow)}.ops{fill:#f9f5ff;stroke:#7f56d9;stroke-width:1.8;filter:url(#shadow)}
      .h1{font:700 34px Inter,Segoe UI,sans-serif;fill:#101828}.h2{font:700 19px Inter,Segoe UI,sans-serif;fill:#101828}.h3{font:700 16px Inter,Segoe UI,sans-serif;fill:#101828}.body{font:500 13px Inter,Segoe UI,sans-serif;fill:#475467}.small{font:500 11px Inter,Segoe UI,sans-serif;fill:#667085}.zone-title{font:700 14px Inter,Segoe UI,sans-serif;fill:#344054;letter-spacing:1.5px}.num{font:700 12px Inter,Segoe UI,sans-serif;fill:#fff}.flow{fill:none;stroke:#344054;stroke-width:2.2;marker-end:url(#arrow)}.flow-blue{fill:none;stroke:#2563eb;stroke-width:2.7;marker-end:url(#arrowBlue)}.flow-mcp{fill:none;stroke:#e85d04;stroke-width:3;marker-end:url(#arrowOrange)}.async{fill:none;stroke:#344054;stroke-width:2.2;stroke-dasharray:9 7;marker-end:url(#arrow)}.support{fill:none;stroke:#7f56d9;stroke-width:1.7;stroke-dasharray:5 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1120"/>
  <text class="h1" x="60" y="62">SecondChance on AWS</text>
  <text class="body" x="60" y="88">Public entry points lead into isolated, private workloads. Every agent tool call is governed before it can reach domain data or AI services.</text>

  <rect class="zone" x="40" y="120" width="1520" height="190" rx="18"/>
  <text class="zone-title" x="62" y="150">PUBLIC EDGE &amp; IDENTITY</text>
  <rect class="card" x="75" y="180" width="170" height="82" rx="12"/>
  <text class="h3" x="160" y="214" text-anchor="middle">People</text><text class="body" x="160" y="238" text-anchor="middle">Donors · NGOs · Admins</text>
  <rect class="security" x="310" y="180" width="160" height="82" rx="12"/>
  <text class="h3" x="390" y="214" text-anchor="middle">AWS WAF</text><text class="body" x="390" y="238" text-anchor="middle">Edge protection</text>
  <rect class="gateway" x="535" y="180" width="190" height="82" rx="12"/>
  <text class="h3" x="630" y="214" text-anchor="middle">CloudFront</text><text class="body" x="630" y="238" text-anchor="middle">Public web gateway</text>
  <rect class="data" x="790" y="180" width="170" height="82" rx="12"/>
  <text class="h3" x="875" y="214" text-anchor="middle">Private S3</text><text class="body" x="875" y="238" text-anchor="middle">React application</text>
  <rect class="security" x="1025" y="180" width="190" height="82" rx="12"/>
  <text class="h3" x="1120" y="214" text-anchor="middle">Amazon Cognito</text><text class="body" x="1120" y="238" text-anchor="middle">Hosted UI · PKCE · JWT</text>
  <rect class="gateway" x="1280" y="180" width="220" height="82" rx="12"/>
  <text class="h3" x="1390" y="210" text-anchor="middle">API Gateway</text><text class="body" x="1390" y="232" text-anchor="middle">JWT authorizer · throttling</text><text class="small" x="1390" y="250" text-anchor="middle">Only public backend entry</text>

  <path class="flow-blue" d="M245 221 H310"/><path class="flow-blue" d="M470 221 H535"/><path class="flow-blue" d="M725 221 H790"/>
  <path class="flow-blue" d="M960 221 H1025"/><path class="flow-blue" d="M1215 221 H1280"/>
  <circle cx="276" cy="221" r="12" fill="#2563eb"/><text class="num" x="276" y="225" text-anchor="middle">1</text>
  <circle cx="1247" cy="221" r="12" fill="#2563eb"/><text class="num" x="1247" y="225" text-anchor="middle">2</text>

  <rect class="zone-private" x="40" y="340" width="1520" height="560" rx="18"/>
  <text class="zone-title" x="62" y="370">PRIVATE VPC · TWO AVAILABILITY ZONES · NO NAT GATEWAY</text>
  <rect class="card" x="90" y="415" width="220" height="90" rx="12"/>
  <text class="h3" x="200" y="450" text-anchor="middle">API Lambda</text><text class="body" x="200" y="474" text-anchor="middle">FastAPI · RBAC · admission</text><text class="small" x="200" y="491" text-anchor="middle">IAM role: application</text>
  <path class="flow-blue" d="M1390 262 V325 Q1390 390 1325 390 H340 Q310 390 310 420"/>
  <circle cx="352" cy="390" r="12" fill="#2563eb"/><text class="num" x="352" y="394" text-anchor="middle">3</text>

  <rect class="card" x="90" y="570" width="220" height="90" rx="12"/>
  <text class="h3" x="200" y="605" text-anchor="middle">SQS queues</text><text class="body" x="200" y="629" text-anchor="middle">jobs · agents · DLQs</text><text class="small" x="200" y="646" text-anchor="middle">Durable asynchronous work</text>
  <path class="async" d="M200 505 V570"/><circle cx="200" cy="538" r="12" fill="#344054"/><text class="num" x="200" y="542" text-anchor="middle">4</text>

  <rect class="card" x="380" y="545" width="210" height="90" rx="12"/>
  <text class="h3" x="485" y="580" text-anchor="middle">Jobs Lambda</text><text class="body" x="485" y="604" text-anchor="middle">PDF ingestion · indexing</text><text class="small" x="485" y="621" text-anchor="middle">SQS partial batch response</text>
  <rect class="card" x="380" y="680" width="210" height="90" rx="12"/>
  <text class="h3" x="485" y="715" text-anchor="middle">Agents Lambda</text><text class="body" x="485" y="739" text-anchor="middle">Supervisor · specialists</text><text class="small" x="485" y="756" text-anchor="middle">Stateless, idempotent steps</text>
  <path class="async" d="M310 600 H380"/><path class="async" d="M310 630 Q345 630 345 725 H380"/>
  <circle cx="345" cy="725" r="12" fill="#344054"/><text class="num" x="345" y="729" text-anchor="middle">5</text>

  <rect class="mcp" x="665" y="665" width="235" height="115" rx="14"/>
  <text class="h2" x="782" y="703" text-anchor="middle">MCP Gateway Lambda</text><text class="body" x="782" y="728" text-anchor="middle">Schemas · allow-lists · quotas</text><text class="body" x="782" y="749" text-anchor="middle">Audit · concurrency bulkhead</text><text class="small" x="782" y="768" text-anchor="middle">The mandatory tool boundary</text>
  <path class="flow-mcp" d="M590 725 H665"/><circle cx="628" cy="725" r="12" fill="#e85d04"/><text class="num" x="628" y="729" text-anchor="middle">6</text>

  <rect class="data" x="675" y="520" width="215" height="88" rx="12"/>
  <text class="h3" x="782" y="553" text-anchor="middle">DynamoDB</text><text class="body" x="782" y="577" text-anchor="middle">Distributed tool quotas</text><text class="small" x="782" y="594" text-anchor="middle">KMS encrypted</text>
  <path class="flow-mcp" d="M782 665 V608"/>
  <rect class="card" x="980" y="680" width="225" height="90" rx="12"/>
  <text class="h3" x="1092" y="715" text-anchor="middle">Tool Executor Lambda</text><text class="body" x="1092" y="739" text-anchor="middle">Private domain operations</text><text class="small" x="1092" y="756" text-anchor="middle">No public route</text>
  <path class="flow-mcp" d="M900 725 H980"/><circle cx="940" cy="725" r="12" fill="#e85d04"/><text class="num" x="940" y="729" text-anchor="middle">7</text>

  <rect class="zone-data" x="960" y="410" width="545" height="230" rx="14"/>
  <text class="zone-title" x="982" y="438">DATA &amp; AI SERVICES REACHED THROUGH VPC ENDPOINTS</text>
  <rect class="data" x="990" y="470" width="150" height="82" rx="12"/><text class="h3" x="1065" y="503" text-anchor="middle">Aurora</text><text class="body" x="1065" y="526" text-anchor="middle">PostgreSQL</text><text class="small" x="1065" y="543" text-anchor="middle">RLS · pgvector</text>
  <rect class="data" x="1165" y="470" width="140" height="82" rx="12"/><text class="h3" x="1235" y="503" text-anchor="middle">Amazon S3</text><text class="body" x="1235" y="526" text-anchor="middle">Tenant objects</text><text class="small" x="1235" y="543" text-anchor="middle">KMS encrypted</text>
  <rect class="data" x="1330" y="470" width="145" height="82" rx="12"/><text class="h3" x="1402" y="503" text-anchor="middle">Bedrock</text><text class="body" x="1402" y="526" text-anchor="middle">Converse · Titan</text><text class="small" x="1402" y="543" text-anchor="middle">Guardrails</text>
  <rect class="security" x="1070" y="575" width="320" height="46" rx="10"/><text class="body" x="1230" y="603" text-anchor="middle">Interface / gateway endpoints · IAM · KMS</text>
  <path class="flow" d="M310 460 H930 Q960 460 990 490"/>
  <path class="flow" d="M590 590 H930 Q960 590 990 530"/>
  <path class="flow-mcp" d="M1205 725 H1260 Q1290 725 1290 640"/>
  <circle cx="1290" cy="658" r="12" fill="#e85d04"/><text class="num" x="1290" y="662" text-anchor="middle">8</text>

  <rect class="card" x="665" y="820" width="235" height="58" rx="12"/><text class="h3" x="782" y="847" text-anchor="middle">EventBridge Scheduler</text><text class="small" x="782" y="866" text-anchor="middle">Retention · stale-work requeue</text>
  <rect class="card" x="980" y="820" width="225" height="58" rx="12"/><text class="h3" x="1092" y="847" text-anchor="middle">Maintenance Lambdas</text><text class="small" x="1092" y="866" text-anchor="middle">Narrow database role</text>
  <path class="async" d="M900 849 H980"/>

  <rect class="zone" x="40" y="930" width="1520" height="145" rx="18"/>
  <text class="zone-title" x="62" y="960">OPERATIONS, DELIVERY &amp; ASSURANCE</text>
  <rect class="ops" x="90" y="985" width="250" height="58" rx="12"/><text class="h3" x="215" y="1012" text-anchor="middle">CloudWatch · X-Ray</text><text class="small" x="215" y="1031" text-anchor="middle">Logs · metrics · traces · alarms</text>
  <rect class="ops" x="390" y="985" width="220" height="58" rx="12"/><text class="h3" x="500" y="1012" text-anchor="middle">SNS · AWS Budgets</text><text class="small" x="500" y="1031" text-anchor="middle">Operational and cost alerts</text>
  <rect class="ops" x="660" y="985" width="240" height="58" rx="12"/><text class="h3" x="780" y="1012" text-anchor="middle">ECR · immutable images</text><text class="small" x="780" y="1031" text-anchor="middle">API · worker · gateway</text>
  <rect class="ops" x="950" y="985" width="250" height="58" rx="12"/><text class="h3" x="1075" y="1012" text-anchor="middle">Terraform · GitHub OIDC</text><text class="small" x="1075" y="1031" text-anchor="middle">No long-lived AWS access keys</text>
  <rect class="ops" x="1250" y="985" width="250" height="58" rx="12"/><text class="h3" x="1375" y="1012" text-anchor="middle">Runtime acceptance probe</text><text class="small" x="1375" y="1031" text-anchor="middle">Aurora · Bedrock · Guardrail · MCP</text>
  <path class="support" d="M215 985 V910 Q215 890 235 890"/><path class="support" d="M500 985 V910"/>
  <text class="small" x="60" y="1100">Solid blue: public HTTPS · Dashed: asynchronous queue · Orange: governed MCP tool path · Purple: operational telemetry</text>
</svg>
