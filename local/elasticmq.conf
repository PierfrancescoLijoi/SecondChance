# Local stand-in for the SQS queues Terraform creates on AWS (ADR-005, ADR-011).
# Visibility timeouts stay above the agent step lease (5 min); after 5 failed receives a
# message moves to its DLQ, like the redrive policy on AWS.
include classpath("application.conf")

# "*" builds queue URLs from the request's Host header, so they work from containers and host.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  jobs-dlq {}
  jobs {
    defaultVisibilityTimeout = 360 seconds
    deadLettersQueue { name = "jobs-dlq", maxReceiveCount = 5 }
  }
  notify-dlq {}
  notify {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue { name = "notify-dlq", maxReceiveCount = 5 }
  }
  agents-dlq {}
  agents {
    defaultVisibilityTimeout = 360 seconds
    deadLettersQueue { name = "agents-dlq", maxReceiveCount = 5 }
  }
}
