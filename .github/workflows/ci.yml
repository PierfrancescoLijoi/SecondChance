name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.8"
      - run: uvx ruff@0.16.10 check .
      - run: uvx ruff@0.16.10 check mcp-gateway
        working-directory: .

  # The README path, from an empty runner: compose up, then the test suite.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.8"
      - run: docker compose up -d # the api target never pulls the Lambda Web Adapter
      - name: API answers on /health
        run: curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/health
      - run: uv run --locked pytest
        working-directory: api
      - run: uv run --locked pytest
        working-directory: mcp-gateway
      - if: failure()
        run: docker compose logs

  # The Lambda images deploy.sh pushes, run by the AWS Runtime Interface Emulator with a read-only
  # filesystem against an Aurora-like database: IAM tokens over TLS, Lambda-to-Lambda Invoke, SQS
  # records and the Lambda Web Adapter behind API Gateway events. No AWS account (infra/emulation).
  aws-emulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.8"
      # ECR Public answers "429 Data limit exceeded" to shared runner addresses: the Lambda Web Adapter
      # comes from the Actions cache, keyed on its version and saved as soon as a pull succeeds.
      - id: lambda-adapter
        run: echo "key=$(bash scripts/ci-lambda-adapter.sh --key)" >> "$GITHUB_OUTPUT"
      - id: lambda-adapter-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lambda-adapter.tar
          key: ${{ steps.lambda-adapter.outputs.key }}
      - run: bash scripts/ci-lambda-adapter.sh ~/.cache/lambda-adapter.tar
      - if: steps.lambda-adapter-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lambda-adapter.tar
          key: ${{ steps.lambda-adapter.outputs.key }}
      - run: bash scripts/emulate-aws.sh
        env:
          SECONDCHANCE_EMULATION_KEEP: "1" # the next step needs the containers for their logs
      - if: always()
        run: |
          [ "${{ job.status }}" = success ] || docker compose -f infra/emulation/compose.yaml logs --no-color
          docker compose -f infra/emulation/compose.yaml down -v

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build # includes the type check

  # Infrastructure as code: format, validate and scan, all from pinned images (NFR-014).
  iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: terraform fmt and validate
        run: |
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf hashicorp/terraform:1.16.5 fmt -recursive -check
          for stack in bootstrap envs/demo envs/pilot; do
            docker run --rm -v "$PWD/infra/terraform:/tf" -w "/tf/$stack" hashicorp/terraform:1.16.5 init -backend=false -input=false
            docker run --rm -v "$PWD/infra/terraform:/tf" -w "/tf/$stack" hashicorp/terraform:1.16.5 validate
          done
          # Offline evaluation with mocked providers: Lambda limits, account quotas, plan-time guards.
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf/envs/demo hashicorp/terraform:1.16.5 test
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf/modules/secondchance hashicorp/terraform:1.16.5 init -backend=false -input=false
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf/modules/secondchance hashicorp/terraform:1.16.5 test
      # The same for the Azure stacks (ADR-023): the module is evaluated with mocked providers whose resource
      # ids are shaped like real Azure ids, so the provider's own validators run without a subscription.
      - name: terraform validate and test (Azure)
        run: |
          for stack in azure/bootstrap azure/envs/demo azure/envs/pilot azure/modules/secondchance; do
            docker run --rm -v "$PWD/infra/terraform:/tf" -w "/tf/$stack" hashicorp/terraform:1.16.5 init -backend=false -input=false
            docker run --rm -v "$PWD/infra/terraform:/tf" -w "/tf/$stack" hashicorp/terraform:1.16.5 validate
          done
          for stack in azure/modules/secondchance azure/envs/demo azure/envs/pilot; do
            docker run --rm -v "$PWD/infra/terraform:/tf" -w "/tf/$stack" hashicorp/terraform:1.16.5 test
          done
      - name: trivy (high and critical misconfigurations fail the build)
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.75.0 config --severity HIGH,CRITICAL --exit-code 1 /src/infra/terraform
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD/scripts:/s:ro" koalaman/shellcheck:v0.10.0 /s/deploy.sh /s/destroy.sh /s/grant-platform-admin.sh /s/build-images.sh /s/connect-aws.sh /s/verify-aws.sh /s/emulate-aws.sh /s/ci-lambda-adapter.sh /s/connect.sh
          docker run --rm -v "$PWD/scripts:/s:ro" koalaman/shellcheck:v0.10.0 -x -e SC1091 /s/azure/lib.sh /s/azure/connect.sh /s/azure/deploy.sh /s/azure/verify.sh /s/azure/destroy.sh /s/azure/grant-platform-admin.sh /s/azure/tests/run.sh /s/azure/tests/fake-bin/az /s/azure/tests/fake-bin/terraform /s/azure/tests/fake-bin/docker /s/azure/tests/fake-bin/curl /s/azure/tests/fake-bin/sleep
          docker run --rm -v "$PWD/infra/emulation:/e:ro" koalaman/shellcheck:v0.10.0 /e/aurora-init.sh
      - name: Azure scripts against stand-in tools
        run: bash scripts/azure/tests/run.sh

  # The Azure images deploy.sh pushes (ADR-023): the API starts with the Azure adapters selected and refuses a
  # request that skipped Front Door; the web image renders its configuration and origin lock from the environment.
  azure-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: web image (nginx template)
        run: |
          docker build --target azure -t secondchance-web-azure web
          docker run -d --rm --name web -p 18080:8080 -e FRONT_DOOR_ID=fd-1 -e CSP_CONNECT_SRC="https://login.microsoftonline.com"             -e CSP_FORM_ACTION="https://login.microsoftonline.com" -e WEB_CONFIG_JSON='{"apiUrl":"/api","authMode":"oidc"}' secondchance-web-azure
          sleep 3
          curl --fail --silent http://127.0.0.1:18080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/config.json)" = 403
          curl --fail --silent -H 'X-Azure-FDID: fd-1' http://127.0.0.1:18080/config.json | grep -q '"authMode":"oidc"'
          docker stop web
      - name: API image with the Azure adapters
        run: |
          docker build --target api -t secondchance-api-azure api
          docker run -d --rm --name api -p 18000:8000 -e SECONDCHANCE_CLOUD=azure -e SECONDCHANCE_ENV=demo -e SECONDCHANCE_AUTH_MODE=entra             -e SECONDCHANCE_ENTRA_ISSUER=https://login.microsoftonline.com/t/v2.0 -e SECONDCHANCE_ENTRA_AUDIENCE=a             -e SECONDCHANCE_ENTRA_JWKS_URI=https://login.microsoftonline.com/t/discovery/v2.0/keys -e SECONDCHANCE_DB_ENTRA_AUTH=1             -e SECONDCHANCE_DATABASE_URL=postgresql+psycopg://secondchance_app@db.invalid:5432/secondchance -e SECONDCHANCE_FRONT_DOOR_ID=fd-1             secondchance-api-azure
          curl --fail --silent --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:18000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/me)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Azure-FDID: fd-1' http://127.0.0.1:18000/me)" = 401
          docker stop api
      - name: MCP gateway image
        run: |
          docker build --target service -t secondchance-gateway-azure mcp-gateway
          docker run --rm secondchance-gateway-azure python -c "import mcp_gateway.app, azure.data.tables"
