[project]
name = "secondchance-mcp-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "awslambdaric>=4.2.0,<4.3",
    "boto3>=1.40",
    "fastapi>=0.115",
    "httpx>=0.28",
    "mcp>=1.30,<2",
    "pydantic>=2.10",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
